
services:
  postgres:
    image: postgres:17
    container_name: shopcore-postgres
    environment:
      POSTGRES_DB: shopcore
      POSTGRES_USER: shopcore
      POSTGRES_PASSWORD: shopcore
    ports:
      - "5432:5432"
    volumes:
      - shopcore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopcore -d shopcore"]
      interval: 5s
      retries: 5
volumes:
  shopcore_data:
